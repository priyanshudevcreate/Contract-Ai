spring:
  application:
    name: ContractAI-Backend
  data:
    mongodb:
      uri: mongodb://localhost:27017/contractgpt

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 3001

jwt:
  secret: YmFzZTY0LWVuY29kZWQtc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc=
  expiration: 86400000 # 24 hours

openai:
  api:
    key: ${OPENAI_API_KEY:your-openai-api-key-here}
    model: gpt-4o
    url: https://api.openai.com/v1/chat/completions
